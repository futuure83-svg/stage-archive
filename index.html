
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- Stage Archive 2.1 | stage-media -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAGE ARCHIVE｜演出记录馆</title>
<style>
:root {
  --bg:#f5f5f3; --paper:#fff; --ink:#202020;
  --muted:#888; --line:#e8e8e5; --soft:#eeeeeb;
  --dark:#222; --radius:12px;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:14px;
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
.app { max-width:1200px; margin:auto; padding:30px 28px 60px; }
header {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 0 28px; border-bottom:1px solid var(--line);
}
.brand { font-size:19px; font-weight:750; letter-spacing:2px; }
.brand small { display:block; color:var(--muted); font-size:10px; font-weight:400; letter-spacing:3px; margin-top:6px; }
.header-note { color:var(--muted); font-size:12px; }
nav {
  display:flex; gap:8px; overflow-x:auto; padding:20px 0;
  border-bottom:1px solid var(--line);
}
nav button {
  border:0; background:transparent; color:var(--muted);
  padding:10px 16px; border-radius:8px; white-space:nowrap;
}
nav button.active { background:var(--dark); color:white; }
main { padding-top:28px; }
.page-title { font-size:25px; font-weight:650; margin:0 0 7px; }
.page-desc { color:var(--muted); font-size:13px; margin-bottom:26px; }
.stats-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;
}
.stat-card,.panel {
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); padding:20px;
}
.stat-label { color:var(--muted); font-size:12px; }
.stat-number { font-size:32px; font-weight:650; margin-top:12px; }
.stat-unit { font-size:12px; color:var(--muted); margin-left:5px; }
.section-heading {
  display:flex; justify-content:space-between; align-items:center;
  margin:26px 0 14px; gap:12px;
}
.section-heading h3 { font-size:15px; margin:0; }
.panel { margin-bottom:16px; }
.empty { color:var(--muted); padding:28px 10px; text-align:center; }
.toolbar { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:16px; }
input,select,textarea {
  border:1px solid var(--line); background:white; border-radius:8px;
  padding:10px 12px; color:var(--ink); min-width:0;
}
input:focus,select:focus,textarea:focus {
  outline:1px solid #999; border-color:#999;
}
.search { flex:1; min-width:180px; }
.btn {
  border:1px solid var(--line); background:white; color:var(--ink);
  padding:9px 14px; border-radius:8px;
}
.btn:hover { background:var(--soft); }
.btn.primary { background:var(--dark); color:white; border-color:var(--dark); }
.btn.danger { color:#a33; }
.btn.small { padding:6px 10px; font-size:12px; }
table { width:100%; border-collapse:collapse; min-width:680px; }
th,td { text-align:left; padding:14px 12px; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-size:12px; font-weight:500; }
td { font-size:13px; }
.table-wrap { overflow-x:auto; }
.tag {
  display:inline-block; background:var(--soft); border-radius:5px;
  padding:4px 7px; font-size:11px; margin:2px;
}
.actions { display:flex; gap:6px; white-space:nowrap; }
.text-muted { color:var(--muted); }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.record-list { display:flex; flex-direction:column; }
.record-item {
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; padding:13px 0; border-bottom:1px solid var(--line);
}
.record-item:last-child { border:0; }
.record-main { min-width:0; }
.record-main strong { display:block; margin-bottom:5px; }
.record-main small { color:var(--muted); }
.bar-row { margin:15px 0; }
.bar-info { display:flex; justify-content:space-between; font-size:12px; margin-bottom:7px; }
.bar { height:7px; background:var(--soft); border-radius:8px; overflow:hidden; }
.bar span { display:block; height:100%; background:#444; border-radius:8px; }
dialog {
  width:min(560px,calc(100% - 24px)); border:0; border-radius:14px;
  padding:0; box-shadow:0 20px 70px #0003; max-height:90vh;
}
dialog::backdrop { background:#0006; }
.modal-head { padding:20px 22px; border-bottom:1px solid var(--line); }
.modal-head h3 { margin:0; font-size:17px; }
.modal-body { padding:20px 22px; max-height:65vh; overflow:auto; }
.modal-foot { padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.field { display:flex; flex-direction:column; gap:7px; }
.field.full { grid-column:1/-1; }
.field label { color:var(--muted); font-size:12px; }
.field input,.field select,.field textarea { width:100%; }
.check-list {
  border:1px solid var(--line); border-radius:8px; padding:10px;
  display:flex; flex-wrap:wrap; gap:10px; max-height:130px; overflow:auto;
}
.check-list label { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink); }
.check-list input { min-width:auto; }
.summary-box {
  background:var(--soft); padding:18px; border-radius:9px;
  line-height:1.9; white-space:pre-wrap;
}
.footer { text-align:center; color:#aaa; font-size:11px; padding:35px 0 0; letter-spacing:1px; }
.hidden { display:none!important; }
@media(max-width:700px) {
  .app { padding:18px 14px 40px; }
  .header-note { display:none; }
  .stats-grid { grid-template-columns:repeat(2,1fr); gap:9px; }
  .stat-card { padding:15px; }
  .stat-number { font-size:26px; }
  .two-col { grid-template-columns:1fr; }
  .form-grid { grid-template-columns:1fr; }
  .field.full { grid-column:auto; }
  .page-title { font-size:22px; }
}
.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}.photo-grid a{display:block}article.panel{margin-bottom:14px}</style>
<style>[hidden]{display:none!important} #cloudStatus{font-size:12px} @media(max-width:600px){header{flex-wrap:wrap;gap:12px}}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}.photo-grid a{display:block}article.panel{margin-bottom:14px}</style><style>.hero3{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;background:#171717;color:#fff;padding:36px;margin-bottom:24px;border-radius:8px}.hero3 h1{font-size:clamp(36px,7vw,82px);line-height:1.1;margin:20px 0;overflow-wrap:anywhere}.hero3 img{width:100%;height:100%;max-height:420px;object-fit:cover}.hero3 .eyebrow{letter-spacing:4px;font-size:11px}.hero3 p{white-space:pre-wrap}.role3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.role3 img{width:100%;aspect-ratio:4/3;object-fit:cover}.heat3{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;width:max-content}.heat3 span{border-radius:2px}.timeline3{border-left:2px solid #aaa;padding-left:20px;margin:18px}.timeline3 article{margin-bottom:22px}.ticket3{padding:24px;background:#fafafa;color:#111;border:2px dashed #555}.hero3 .btn{color:#111;background:white}@media(max-width:650px){.hero3{grid-template-columns:1fr;padding:24px}}</style><style>.banner31{width:100%;max-height:260px;object-fit:cover}.poster31{width:140px;max-width:100%;float:right;margin:12px}.film31 .photo-grid{background:#222;padding:12px;border-top:8px dotted #eee;border-bottom:8px dotted #eee}#q31{width:100%;padding:12px} @media(max-width:600px){nav{overflow-x:auto;flex-wrap:nowrap} .toolbar{flex-wrap:wrap} .panel{overflow-wrap:anywhere} input,textarea,select{max-width:100%;font-size:16px} .photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body>
<div class="app">
<header>
  <div class="brand">STAGE ARCHIVE<small>PERSONAL PERFORMANCE RECORDS</small></div>
  <div><span id="cloudStatus">正在读取…</span> <button class="btn small" id="authButton" onclick="admin?logout():login()">管理员登录</button> <button class="btn small" onclick="share()">复制分享链接</button></div>
</header>

<nav id="nav">
  <button class="active" data-page="overview">总览</button>
  <button data-page="schedule">演出排期</button>
  <button data-page="actors">演员名单</button>
  <button data-page="news">资讯动态</button><button data-page="gallery">照片图库</button><button data-page="plays">剧目档案</button>
  <button data-page="timeline">生涯时间轴</button><button data-page="roles">角色博物馆</button><button data-page="stats">数据总结</button>
  <button data-page="data">数据管理</button>
</nav>
<main id="main"></main>
<div class="footer">STAGE ARCHIVE 3.1 · EVERY PERFORMANCE MATTERS</div>
</div>

<dialog id="dialog">
  <form id="modalForm">
    <div class="modal-head"><h3 id="modalTitle">新增记录</h3></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button type="button" class="btn" onclick="closeModal()">取消</button>
      <button type="submit" class="btn primary">保存记录</button>
    </div>
  </form>
</dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY = "stage_archive_v1";
const SUPABASE_URL = "https://vmyezfetsuunjpgyvmvp.supabase.co";
const SUPABASE_KEY = "sb_publishable_aRApOyQM1jH47Go3btJMEA_SMzJtvGs";
const ADMIN_UID = "030056dc-bc2d-42bb-8dd3-1cf54e06e622";
const cloud = window.supabase && SUPABASE_URL.startsWith("https://") ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY) : null;
let db = {records:[],actors:[],plays:[],profile:{}};
let admin=false, ready=false, pending=Promise.resolve();
function normalize(d){return {...(d||{}),rolesMeta:d?.rolesMeta||{},records:Array.isArray(d?.records)?d.records:[],actors:Array.isArray(d?.actors)?d.actors:[],plays:Array.isArray(d?.plays)?d.plays:[],profile:d?.profile||{},posts:Array.isArray(d?.posts)?d.posts:[]};}
function status(t){document.getElementById("cloudStatus").textContent=t;}
async function start(){
 if(!cloud){status("尚未配置云端连接");render();return;}
 try {const {data:{session}}=await cloud.auth.getSession();
 const {data,error}=await cloud.from("stage_archive").select("data").eq("id",1).single();
 if(error)throw error; db=normalize(data.data); ready=true;admin=session?.user?.id===ADMIN_UID;status(admin?"管理员模式":"公开浏览模式");render();}
 catch(e){ready=false;admin=false;status("读取失败："+e.message);render();}
}
async function login(){if(!cloud)return alert("请先配置 Supabase");const email=prompt("管理员邮箱");if(!email)return;const password=prompt("管理员密码");if(!password)return;const {data,error}=await cloud.auth.signInWithPassword({email,password});if(error)return alert(error.message);if(data.user.id!==ADMIN_UID){await cloud.auth.signOut();return alert("此账户不是管理员");}await start();}
async function logout(){await pending;await cloud.auth.signOut();admin=false;showPage("overview");await start();}
function share(){navigator.clipboard.writeText(location.href.split("#")[0]).then(()=>alert("网址已复制")).catch(()=>prompt("复制网址",location.href));}
function profileHTML(){const p=db.profile||{};return `<section class="panel"><div style="font-size:12px;letter-spacing:3px">PERFORMANCE ARCHIVE</div><h1 style="font-size:48px;margin:12px 0">${esc(String(p.name||"").trim()||"演员演出档案")}</h1><p class="text-muted">个人演出档案 · 非官方整理</p>${/^https:\/\//i.test(p.photo||"")?`<img src="${esc(p.photo)}" alt="演员照片" style="max-width:180px;max-height:240px;object-fit:contain" referrerpolicy="no-referrer">`:""}${[["生日",p.birthday],["职业",p.occupation],["社交平台",p.social],["个人简介",p.bio]].filter(x=>x[1]).map(([k,v])=>`<p><strong>${k}：</strong>${esc(v)}</p>`).join("")}${admin?'<button class="btn" onclick="editProfile()">编辑个人资料</button>':""}</section>`;}
function editProfile(){if(!admin)return;const p=db.profile||{};openModal("编辑个人资料",`<div class="form-grid">${[["name","演员姓名"],["photo","照片网址（HTTPS，可留空）"],["birthday","生日"],["occupation","职业"],["social","社交平台"],["bio","个人简介"]].map(([k,l])=>`<div class="field full"><label>${l}</label><textarea name="${k}">${esc(p[k]||"")}</textarea></div>`).join("")}</div>`,f=>{db.profile={...db.profile,...Object.fromEntries(f.entries())};saveDB();closeModal();render();});}
function specialLabel(r){return r.special?(r.specialType||"特殊场"):"普通场";}
function extraStats(){return [["角色分布",r=>r.role||"未填写"],["特殊场次分布",r=>r.special?specialLabel(r):null],["演出年份",r=>r.date?.slice(0,4)]].map(([title,key])=>{const m=new Map();db.records.forEach(r=>{const k=key(r);if(k)m.set(k,(m.get(k)||0)+1);});const a=[...m].sort((x,y)=>y[1]-x[1]);return `<section class="panel"><h3>${title}</h3>${a.length?a.map(([k,v])=>`<div class="bar-row"><div class="bar-info"><span>${esc(k)}</span><span>${v} 场</span></div><div class="bar"><span style="width:${100*v/a[0][1]}%"></span></div></div>`).join(""):empty("暂无数据")}</section>`;}).join("");}

let currentPage = "overview";
let editingId = null;

function loadDB() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.records)) {
      return {
        records:saved.records,
        actors:Array.isArray(saved.actors)?saved.actors:[],
        plays:Array.isArray(saved.plays)?saved.plays:[]
      };
    }
  } catch(e) {}
  return {records:[],actors:[],plays:[]};
}
function saveDB() {
 if(!admin||!ready)return;
 const snapshot=JSON.parse(JSON.stringify(db));status("正在保存…");
 pending=pending.then(async()=>{const {data,error}=await cloud.from("stage_archive").update({data:snapshot,updated_at:new Date().toISOString()}).eq("id",1).select("id");if(error||!data?.length)throw new Error(error?.message||"没有更新权限");status("已保存至云端");}).catch(e=>{status("保存失败："+e.message);alert("云端保存失败，请导出备份后重试。" );});
}
function uid() {
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function esc(value) {
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function fmtDate(date) {
  if(!date) return "—";
  return date.replaceAll("-",".");
}
function showPage(page) {
  if(page==="data"&&!admin)return;
  currentPage=page;
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });
  render();
}
document.getElementById("nav").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-page]");
  if(btn) showPage(btn.dataset.page);
});
function render() {
  const pages={
    overview:renderOverview, timeline:timeline3, roles:roles3,
    schedule:renderSchedule,
    actors:renderActors,
    plays:renderPlays, news:()=>renderPosts(false), gallery:()=>renderPosts(true),
    stats:renderStats,
    data:renderData
  };
  document.getElementById("main").innerHTML=pages[currentPage]();
  document.getElementById("authButton").textContent=admin?"退出登录":"管理员登录";
  document.querySelector('[data-page="data"]').hidden=!admin;
  if(!admin){document.querySelectorAll('#main button').forEach(b=>{if(/^(openRecord|openActor|openPlay|deleteRecord|deleteActor|deletePlay|editProfile|clearAll)/.test(b.getAttribute('onclick')||''))b.remove();});document.querySelectorAll('#main .actions').forEach(e=>e.remove());}
  if(currentPage==="overview")document.getElementById("main").insertAdjacentHTML("afterbegin",hero3()+home3());
  if(currentPage==="overview")document.getElementById("main").insertAdjacentHTML("beforeend",`<section class="panel"><h3>最新资讯</h3>${postCards(sortedPosts().slice(0,3))}</section>`);
  if(currentPage==="stats")document.getElementById("main").insertAdjacentHTML("beforeend",extraStats()+heat3());
}
function heading(title,desc) {
  return `<h1 class="page-title">${title}</h1><div class="page-desc">${desc}</div>`;
}
function stat(label,value,unit="项") {
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-number">${value}<span class="stat-unit">${unit}</span></div></div>`;
}
function empty(text) {
  return `<div class="empty">${text}</div>`;
}
function getActorNames(ids) {
  return (ids||[]).map(id=>db.actors.find(a=>a.id===id)?.name).filter(Boolean);
}
function getRecordPlay(r) {
  return r.play || "未填写剧目";
}
function renderOverview() {
  const records=[...db.records].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const special=records.filter(r=>r.special).length;
  const plays=new Set(records.map(r=>r.play).filter(Boolean)).size;
  const actorCount=new Set(records.flatMap(r=>r.actors||[])).size;
  const recent=records.slice(0,5);
  const counts={};
  records.forEach(r=>counts[getRecordPlay(r)]=(counts[getRecordPlay(r)]||0)+1);
  const ranking=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return heading("演出总览","每一场演出，都值得被认真记录。")+`
  <div class="stats-grid">
    ${stat("演出总场次",records.length,"场")}
    ${stat("参与剧目",plays,"部")}
    ${stat("合作演员",actorCount,"位")}
    ${stat("特殊场次",special,"场")}
  </div>
  <div class="two-col">
    <section class="panel">
      <div class="section-heading"><h3>最近添加</h3><button class="btn small" onclick="showPage('schedule')">全部记录 →</button></div>
      <div class="record-list">${recent.length?recent.map(r=>`
        <div class="record-item"><div class="record-main">
          <strong>${esc(r.play)} · ${esc(r.role||"角色未填写")}</strong>
          <small>${fmtDate(r.date)}　${esc(r.venue||"地点未填写")}</small>
        </div><span class="tag">${esc(specialLabel(r))}</span></div>`).join(""):empty("还没有演出记录")}</div>
    </section>
    <section class="panel">
      <div class="section-heading"><h3>剧目场次排行</h3></div>
      ${ranking.length?ranking.map(([name,n])=>`
        <div class="bar-row"><div class="bar-info"><span>${esc(name)}</span><span>${n} 场</span></div>
        <div class="bar"><span style="width:${n/Math.max(...ranking.map(x=>x[1]))*100}%"></span></div></div>
      `).join(""):empty("添加演出后，这里会显示统计")}
    </section>
  </div>
  <div class="section-heading"><h3>快速操作</h3></div>
  <div class="panel toolbar">
    <button class="btn primary" onclick="openRecord()">＋ 新增演出记录</button>
    <button class="btn" onclick="openActor()">＋ 添加演员</button>
    <button class="btn" onclick="openPlay()">＋ 添加剧目</button>
  </div>`;
}
function renderSchedule() {
  const q=(document.getElementById("recordSearch")?.value||"").toLowerCase();
  const filter=document.getElementById("recordFilter")?.value||"";
  let records=orderedRecords().reverse();
  records=records.filter(r=>{
    const text=[r.date,r.play,r.role,r.venue,r.time,r.note,...getActorNames(r.actors)].join(" ").toLowerCase();
    return text.includes(q)&&(!filter||(filter==="special"?r.special:r.play===filter));
  });
  return heading("总排期","累计 "+db.records.length+" 场 · 当前筛选 "+records.length+" 场")+`
  <div class="toolbar">
    <input id="recordSearch" class="search" placeholder="搜索剧目、角色、演员、地点……" value="${esc(q)}" oninput="refreshSchedule()">
    <select id="recordFilter" onchange="refreshSchedule()">
      <option value="">全部记录</option>
      <option value="special" ${filter==="special"?"selected":""}>仅特殊场</option>
      ${db.plays.map(p=>`<option value="${esc(p.name)}" ${filter===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}
    </select>
    <button class="btn primary" onclick="openRecord()">＋ 新增记录</button>
  </div>
  <div class="panel table-wrap">
    ${records.length?`<table><thead><tr>
      <th>累计场次</th><th>日期 / 时间</th><th>剧目 / 角色</th><th>演出地点</th><th>同场演员</th><th>场次</th><th>操作</th>
    </tr></thead><tbody>${records.map(r=>`
      <tr>
        <td>No.${recordNumber(r)}</td><td>${fmtDate(r.date)}<br><span class="text-muted">${esc(r.time||"")}</span></td>
        <td><strong>${esc(r.play)}</strong><br><span class="text-muted">${esc(r.role||"—")}</span></td>
        <td>${esc(r.venue||"—")}</td>
        <td>${getActorNames(r.actors).map(n=>`<span class="tag">${esc(n)}</span>`).join("")||"—"}</td>
        <td>${esc(specialLabel(r))}<br><button class="btn small" onclick="ticket3(${db.records.indexOf(r)})">纪念票根</button></td>

function renderStats() {
  const records=db.records;

    });
    const month=(r.date||"").slice(0,7);
    if(month) monthCounts[month]=(monthCounts[month]||0)+1;
  });
  const rank=Object.entries(playCounts).sort((a,b)=>b[1]-a[1]);
  const actorRank=Object.entries(actorCounts).sort((a,b)=>b[1]-a[1]);
  const months=Object.entries(monthCounts).sort((a,b)=>a[0].localeCompare(b[0]));
  const special=records.filter(r=>r.special).length;
  const text=`截至目前，共记录 ${records.length} 场演出，涉及 ${Object.keys(playCounts).length} 部剧目，${db.actors.length} 位演员已加入资料库。${special?`其中包含 ${special} 场特殊场次。`:"目前还没有标记特殊场次。"}${rank.length?`记录最多的剧目是《${rank[0][0]}》，共 ${rank[0][1]} 场。`:""}${actorRank.length?`同场次数最多的演员是 ${actorRank[0][0]}，共 ${actorRank[0][1]} 次。`:""}`;
  const maxPlay=Math.max(1,...rank.map(x=>x[1]));
  const maxActor=Math.max(1,...actorRank.map(x=>x[1]));
  return heading("数据总结","从数字中回顾你的演出记录。")+`

      ${rank.length?rank.map(([n,v])=>`<div class="bar-row"><div class="bar-info"><span>${esc(n)}</span><span>${v} 场</span></div><div class="bar"><span style="width:${v/maxPlay*100}%"></span></div></div>`).join(""):empty("暂无数据")}
    </section>
    <section class="panel"><h3>同场演员频次</h3>
      ${actorRank.length?actorRank.map(([n,v])=>`<div class="bar-row"><div class="bar-info"><span>${esc(n)}</span><span>${v} 次</span></div><div class="bar"><span style="width:${v/maxActor*100}%"></span></div></div>`).join(""):empty("暂无数据")}
    </section>
  </div>
  <section class="panel"><h3>每月演出记录</h3>
    ${months.length?months.map(([n,v])=>`<div class="bar-row"><div class="bar-info"><span>${n}</span><span>${v} 场</span></div><div class="bar"><span style="width:${v/Math.max(1,...months.map(x=>x[1]))*100}%"></span></div></div>`).join(""):empty("暂无数据")}
  </section>
  <section class="panel"><h3>自动生成的文字总结</h3><div class="summary-box">${esc(text)}</div>
  <div style="margin-top:14px"><button class="btn" onclick="copySummary()">复制总结</button></div></section>`;

function orderedRecords(){return [...db.records].sort((a,b)=>`${a.date||''} ${a.time||''}`.localeCompare(`${b.date||''} ${b.time||''}`));}
function recordNumber(r){return orderedRecords().indexOf(r)+1;}
let postFilter='';
function sortedPosts(){return [...(db.posts||[])].sort((a,b)=>Number(!!b.pin)-Number(!!a.pin)||String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)));}
function safeURL(u){return /^https:\/\//i.test(u||'')?esc(u):'';}
function videoCard(p){const url=safeURL(p.videoUrl);if(!url)return '';const cover=safeURL(p.videoCover);let embed='';try{const u=new URL(p.videoUrl);if(['www.bilibili.com','bilibili.com','m.bilibili.com'].includes(u.hostname)){const m=u.pathname.match(/\/video\/(BV[0-9A-Za-z]+)(?:\/|$)/);if(m)embed=`<iframe title="B站视频" loading="lazy" src="https://player.bilibili.com/player.html?bvid=${m[1]}&amp;autoplay=0" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`;}}catch(e){}return `<div style="border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:8px">${embed|| (cover?`<a href="${url}" target="_blank" rel="noopener noreferrer"><img src="${cover}" loading="lazy" alt="视频封面" style="max-width:100%;max-height:240px;object-fit:contain"></a>`:'')}<p><a href="${url}" target="_blank" rel="noopener noreferrer">▶ ${esc(p.videoTitle||'观看视频')} · 打开原平台</a></p></div>`;}
function postCards(posts,gallery=false){return posts.length?posts.map(p=>`<article class="panel"><div class="text-muted">${p.pin?'置顶 · ':''}${esc(p.date)} · ${esc(p.category||'动态')} · ${esc(db.plays.find(x=>x.id===p.playId)?.name||'个人动态')}</div><h3>${esc(p.title||'')}</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.body||'')}</p><div class="photo-grid">${(p.images||[]).filter(safeURL).map(u=>`<a href="${safeURL(u)}" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="${safeURL(u)}" alt="档案照片"></a>`).join('')}</div>${videoCard(p)}<p class="text-muted">${esc(p.source||'')}${safeURL(p.url)?` · <a href="${safeURL(p.url)}" target="_blank" rel="noopener noreferrer">查看原文</a>`:''}</p>${admin?`<button class="btn small" onclick="editPost(${db.posts.indexOf(p)})">编辑</button> <button class="btn small danger" onclick="removePost(${db.posts.indexOf(p)})">删除</button>`:''}</article>`).join(''):empty('暂无资料');}
function renderPosts(gallery){const posts=sortedPosts().filter(p=>(!postFilter||p.playId===postFilter)&&(!gallery||(p.images||[]).length));return heading(gallery?'照片图库':'资讯动态','非官方整理 · 按剧目归档')+`<div class="toolbar"><select onchange="postFilter=this.value;render()"><option value="">全部剧目</option>${db.plays.map(p=>`<option value="${esc(p.id)}" ${p.id===postFilter?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${admin?'<button class="btn primary" onclick="editPost(-1)">＋ 发布动态 / 上传照片</button>':''}</div>`+postCards(posts,gallery);}

function package31(){if(!admin)return;const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const p=JSON.parse(await f.files[0].text());if(p.format!=='stage-archive-pack-v1')throw Error('资料包格式不正确');for(const k of ['plays','roles','posts'])if(p[k]!=null&&!Array.isArray(p[k]))throw Error('字段必须为数组');pack31=p;const items=['plays','roles','posts'].flatMap(k=>(p[k]||[]).map((v,i)=>({k,i,v})));openModal('预览增量资料包',items.map(({k,i,v})=>`<p><label><input type="checkbox" name="${k}:${i}" checked> ${esc(k+' · '+(v.name||v.title||v.role||''))}</label><br>${esc(JSON.stringify(v))}</p>`).join(''),form=>{const next=clone31(db);let n=0;for(const {k,i,v} of items){if(!form.has(k+':'+i))continue;const play=next.plays.find(p=>p.name===(k==='plays'?v.name:v.play));if(k==='plays'&&play){for(const key of ['note','poster','theme','background','source','sourceUrl','sourceDate','verified'])if(!play[key]&&typeof v[key]==='string')play[key]=v[key];n++;}if(k==='roles'&&play&&next.records.some(r=>r.play===v.play&&r.role===v.role)){const key=JSON.stringify([v.play,v.role]);const m=next.rolesMeta[key]||={};for(const a of ['bio','photo','quote','source','sourceUrl','sourceDate','verified'])if(!m[a]&&typeof v[a]==='string')m[a]=v[a];n++;}if(k==='posts'&&(!v.play||play)&&typeof v.title==='string'&&typeof v.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v.date)&&!next.posts.some(p=>(v.url&&p.url===v.url)||(p.title===v.title&&p.date===v.date&&p.playId===(play?.id||'')))){const p={id:uid(),playId:play?.id||'',images:[]};for(const a of ['title','date','body','category','source','url','verified','videoUrl','videoTitle'])if(typeof v[a]==='string')p[a]=v[a];next.posts.push(p);n++;}}if(!n)return alert('没有匹配或新增资料');db=normalize(next);saveDB();closeModal();render();alert('已处理 '+n+' 项，请确认云端保存状态');});}catch(e){alert(e.message);}};f.click();}
const render31=render;render=function(){render31();const main=document.getElementById('main');if(currentPage==='overview')main.insertAdjacentHTML('afterbegin',`<section class="panel"><input id="q31" placeholder="搜索全站档案" oninput="search31()"><div id="results31"></div><button class="btn" onclick="random31()">随机舞台记忆</button></section>`);if(currentPage==='news'&&admin)main.insertAdjacentHTML('afterbegin','<button class="btn" onclick="quick31()">快捷转载</button>');if(currentPage==='gallery')main.classList.add('film31');else main.classList.remove('film31');if(currentPage==='stats'){main.insertAdjacentHTML('beforeend',`<section class="panel"><h3>年度演艺报告</h3><select id="year31" onchange="drawReport31()">${[...new Set([day3().slice(0,4),...db.records.map(r=>r.date?.slice(0,4)).filter(Boolean)])].sort().reverse().map(y=>`<option>${esc(y)}</option>`).join('')}</select><div id="report31"></div><button class="btn" onclick="exportReport31()">导出年度长图</button><h3>角色履历</h3>${roleGroups3().map(([k,rs])=>`<p>${esc(rs[0].role)} · ${rs.length} 场</p><div style="height:10px;background:#777;width:${100*rs.length/Math.max(1,db.records.length)}%"></div>`).join('')}</section>`);drawReport31();}if(currentPage==='data'&&admin)main.insertAdjacentHTML('afterbegin',`<section class="panel"><h3>智能资料包</h3><button class="btn primary" onclick="package31()">增量导入资料包</button><button class="btn" onclick="undoLast31()">撤销上次修改</button><p>撤销及日志仅在本次登录页面有效，刷新前请备份。</p>${log31.slice(0,15).map(x=>`<p>${esc(x)}</p>`).join('')}<h3>待完善资料</h3>${db.plays.map(p=>`<p>${esc(p.name)}：${esc([!p.note?'简介':'',!p.poster?'海报':'',!p.sourceUrl?'来源':''].filter(Boolean).join('、')||'已完善')}</p>`).join('')}${roleGroups3().map(([k,rs])=>{const m=db.rolesMeta[k]||{};return `<p>${esc(rs[0].role)}：${esc([!m.bio?'简介':'',!m.photo?'照片':'',!m.sourceUrl?'来源':''].filter(Boolean).join('、')||'已完善')}</p>`;}).join('')}</section>`);};
